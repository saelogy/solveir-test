<script language="JavaScript">
monthnames = new Array("January","February","March","April","May","June","July","August","September","October","November","December");
var linkcount=0;
function addlink(month, day, href) {
    var entry = new Array(3);
    entry[0] = month;
    entry[1] = day;
    entry[2] = href;
    this[linkcount++] = entry;
}
Array.prototype.addlink = addlink;
linkdays = new Array();

monthdays = new Array(12);
monthdays[0]=31; monthdays[1]=28; monthdays[2]=31; monthdays[3]=30;
monthdays[4]=31; monthdays[5]=30; monthdays[6]=31; monthdays[7]=31;
monthdays[8]=30; monthdays[9]=31; monthdays[10]=30; monthdays[11]=31;

todayDate=new Date();
thisday=todayDate.getDay();
thismonth=todayDate.getMonth();
thisdate=todayDate.getDate();
thisyear=todayDate.getFullYear();

if (((thisyear % 4 == 0) && !(thisyear % 100 == 0)) || (thisyear % 400 == 0)) monthdays[1]++;

startspaces=thisdate;
while (startspaces > 7) startspaces-=7;
startspaces = thisday - startspaces + 1;
if (startspaces < 0) startspaces+=7;

document.write("<table border=0>");
document.write("<tr><td colspan=7 class='header-cell'><center><div class='header'><img src='images/flowerbullet.png' class='header-icon'><span class='month-text'> "+ monthnames[thismonth] + " " + thisyear +"</span> <img src='images/flowerbullet.png' class='header-icon'></div></center></td></tr>");
document.write("<tr>");
document.write("<td align=center class='weekend'>Sun</td>");
document.write("<td align=center class='day-of-week'>Mon</td>");
document.write("<td align=center class='day-of-week'>Tue</td>");
document.write("<td align=center class='day-of-week'>Wed</td>");
document.write("<td align=center class='day-of-week'>Thu</td>");
document.write("<td align=center class='day-of-week'>Fri</td>");
document.write("<td align=center class='weekend'>Sat</td>"); 
document.write("</tr>");
document.write("<tr>");

for (s=0; s<startspaces; s++) {
    document.write("<td> </td>");
}

count=1;
while (count <= monthdays[thismonth]) {
    for (b = startspaces; b < 7; b++) {
        var linktrue = false;
        var currentClass = "";
        
        if (count == thisdate) {
            currentClass = "today-cell";
        }

        if (count <= monthdays[thismonth]) {
            document.write("<td class='" + currentClass + "'>");
            
            for (c=0; c<linkdays.length; c++) {
                if (linkdays[c] != null && linkdays[c][0] == thismonth + 1 && linkdays[c][1] == count) {
                    document.write("<a href=\"" + linkdays[c][2] + "\">");
                    linktrue = true;
                }
            }
            
            document.write(count);
            
            if (linktrue) document.write("</a>");
            document.write("</td>");
        } else {
            document.write("<td> </td>");
        }
        count++;
    }
    document.write("</tr><tr>");
    startspaces=0;
}
document.write("</table>");
